<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gallery</title>
    </head>
    <body>
        <header>
            <h1 style="color: blue; background-color: lightgrey">Gallery</h1>
        </header>
        <main>
            <div>
                <h2>Random Images</h2>
            </div>
            <div class="image-area">
                <img src="https://picsum.photos/400/300" alt="image-1" />
                <img src="https://picsum.photos/350/250" alt="image-2" />
            </div>
        </main>

        <footer>
            <p>
                This gallery shows some random images that demonstrate the use
                of the <sup>image</sup> tag in HTML. We use
                <small>small text</small> to add additional information below
                each image.
            </p>
        </footer>
    </body>
</html>
