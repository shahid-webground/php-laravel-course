<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Class 9</title>
    </head>
    <body>
        <header>
            <div class="heading">
                <h2>Life of an Ant and a Spider</h2>
            </div>
            <hr />
        </header>
        <main>
            <section class="section-one">
                <p>
                    Behind the bush, upon the mound, <br />ants are moving
                    without a sound. <br />Leaves are passed along the chain,
                    <br />where ants are lined as one.
                </p>
            </section>

            <section class="section-two">
                <p>
                    Strands of silver make its net,<br />
                    a fly is caught in its web;<br />
                    Now it’s too late,<br />
                    the spider comes to seal its fate.
                </p>
            </section>
        </main>
        <footer class="summer">
            <h2>Summer</h2>
            <hr />
        </footer>
    </body>
</html>
